// Split the history into parts small enough for a phone camera to read off a screen.
function doctorPages(p, made, maxBytes = 800) {
  const enc = s => new TextEncoder().encode(s).length;
  const name = sec(p, 'basics').name || t('Patient');
  const headFor = (i, n) => t('MEDICAL HISTORY: {name}', { name }) + (n > 1 ? ', ' + t('part {i} of {n}', { i, n }) : '') + '\n' + madeLine(p, made);
  const room = maxBytes - enc(headFor(9, 9)) - 2;
  const pieces = [];
  for (const block of doctorBlocks(p)) {
    if (enc(block) <= room) { pieces.push(block); continue; }
    // a block bigger than one part is split by line, repeating its heading
    const [title, ...rest] = block.split('\n');
    let cur = title;
    for (const ln of rest) {
      if (enc(cur + '\n' + ln) > room) { pieces.push(cur); cur = title + ' ' + t('(continued)'); }
      cur += '\n' + ln;
    }
    pieces.push(cur);
  }
  const bodies = [];
  let cur = '';
  for (const piece of pieces) {
    const next = cur ? cur + '\n\n' + piece : piece;
    if (cur && enc(next) > room) { bodies.push(cur); cur = piece; } else cur = next;
  }
  if (cur) bodies.push(cur);
  return bodies.map((body, i) => headFor(i + 1, bodies.length) + '\n\n' + body);
}

/* family sync code: the person's data compressed and cut into numbered QR frames */
function bytesToB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function packText(str) {
  const raw = new TextEncoder().encode(str);
  if ('CompressionStream' in window) {
    const out = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    return 'z' + bytesToB64(out);
  }
  return 'r' + bytesToB64(raw);
}
async function unpackText(s) {
  const bytes = b64ToBytes(s.slice(1));
  if (s[0] === 'z') return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return new TextDecoder().decode(bytes);
}
async function syncFrames(p) {
  const clean = JSON.parse(JSON.stringify(p));
  clean.data.basics.photo = '';
  clean.data.docs = { items: [] };
  const packed = await packText(JSON.stringify({ v: 1, made: Date.now(), p: clean }));
  const size = 420;
  const n = Math.ceil(packed.length / size);
  const sid = Math.random().toString(36).slice(2, 7);
  return Array.from({ length: n }, (_, i) => `MIS1|${sid}|${i + 1}|${n}|${packed.slice(i * size, (i + 1) * size)}`);
}

/* ---------- scanning a family sync code ---------- */
let camStream = null, scanLoop = 0;
function stopCamera() {
  cancelAnimationFrame(scanLoop); scanLoop = 0;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'vendor/jsQR.min.js';
    s.onload = () => res(window.jsQR);
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
let incoming = null;

async function renderScan() {
  if (!(await requireUnlock())) { location.hash = '#/'; return; }
  app().innerHTML = `
    <header class="bar"><a class="btn icon ghost" href="#/" aria-label="${t('Back')}">${ICON.back}</a><h1>${t('Scan family sync code')}</h1></header>
    <main class="wrap scan">
      <div class="cam"><video playsinline muted></video><div class="cam-frame"></div></div>
      <p class="scan-status" data-status>${t('Point the camera at the code on the other phone.')}</p>
      <div class="scan-bar"><span data-bar></span></div>
    </main>`;
  const video = $('video'), status = $('[data-status]'), bar = $('[data-bar]');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    status.textContent = t('The camera could not be opened. Allow camera access for this app in the browser settings.');
    return;
  }
  video.srcObject = camStream;
  await video.play().catch(() => {});
  let detector = null;
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) { detector = null; }
  const jsqr = detector ? null : await loadJsQR().catch(() => null);
  if (!detector && !jsqr) { status.textContent = t('This browser cannot read QR codes.'); return; }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const parts = new Map();
  let sid = null, total = 0, busy = false, lastWarn = 0, lastTick = 0;

  const handle = async text => {
    const m = /^MIS1\|(\w+)\|(\d+)\|(\d+)\|(.*)$/s.exec(text || '');
    if (!m) {
      if (Date.now() - lastWarn > 3000) { lastWarn = Date.now(); status.textContent = t('That code is not a family sync code. Open Share, then Family sync on the other phone.'); }
      return;
    }
    if (sid !== m[1]) { sid = m[1]; parts.clear(); total = +m[3]; }
    parts.set(+m[2], m[4]);
    status.textContent = t('Read {i} of {n} parts.', { i: parts.size, n: total });
    bar.style.width = (parts.size / total * 100) + '%';
    if (parts.size === total) {
      stopCamera();
      status.textContent = t('All parts read.');
      try {
        const packed = Array.from({ length: total }, (_, i) => parts.get(i + 1)).join('');
        const data = JSON.parse(await unpackText(packed));
        if (data.v !== 1 || !goodId(data.p?.id) || !data.p.data) throw new Error('bad');
        incoming = { p: data.p, made: data.made };
        location.hash = '#/merge';
      } catch (e) {
        status.textContent = t('The code could not be read. Open Family sync again on the other phone and rescan.');
      }
    }
  };
  const tick = async () => {
    if (!camStream) return;
    scanLoop = requestAnimationFrame(tick);
    if (busy || video.readyState < 2 || performance.now() - lastTick < 90) return;
    lastTick = performance.now();
    busy = true;
    try {
      if (detector) {
        const codes = await detector.detect(video);
        for (const c of codes) await handle(c.rawValue);
      } else {
        const w = 720, h = Math.round(video.videoHeight / video.videoWidth * w) || 540;
        canvas.width = w; canvas.height = h;
        ctx.drawImage(video, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        const r = jsqr(img.data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) await handle(r.data);
      }
    } catch (e) { /* keep scanning */ }
    busy = false;
  };
  tick();
}

/* ---------- reviewing and applying a scanned update ---------- */
function fieldShow(f, v) {
  if (f.type === 'check') return t(v ? 'Yes' : 'No');
  if (!filled(v)) return '';
  return valueText(f, v);
}
function listShow(s, d) {
  if (s.log) return [...(d?.items || [])].filter(r => r.when).sort((a, b) => b.when.localeCompare(a.when)).map(r => readingLine(s.key, r, true));
  if (s.key === 'vaccines') return (d?.items || []).filter(i => itemFilled(i, s.items)).map(i => `${vaccineKey(i.name) ? t(vaccineKey(i.name)) : i.name || t('Vaccine')}: ${shotLine(i)}${i.next ? ', ' + t('next due {date}', { date: fmtDate(i.next) }) : ''}`);
  const items = (d?.items || []).filter(i => itemFilled(i, s.items));
  const out = items.map(i => s.items.map(f => f.type === 'check' ? (i[f.k] ? t(f.label) : '') : f.type === 'datetime' && i[f.k] ? t('last dose {when}', { when: fmtStamp(i[f.k]) }) : f.type === 'select' && i[f.k] ? t(i[f.k]) : i[f.k]).filter(Boolean).join(', '));
  if (!out.length && d?.none) out.push(t(s.none));
  return out;
}
const solid = o => JSON.stringify(Object.keys(o || {}).sort().filter(k => filled(o[k])).map(k => [k, o[k]]));
const sameItem = (a, b) => Array.isArray(a) && Array.isArray(b)
  ? a.length === b.length && a.every((x, i) => sameItem(x, b[i]))
  : (a?.id && b?.id ? a.id === b.id && solid(a) === solid(b) : solid(a) === solid(b));
function cleanItems(s, d) { return (d?.items || []).filter(i => itemFilled(i, s.items)); }

function diffPeople(mine, theirs) {
  const diffs = [];
  for (const s of SECTIONS) {
    if (s.docs) continue;
    const dm = sec(mine, s.key), dt = sec(theirs, s.key);
    const tm = mine.updated?.[s.key] || 0, tt = theirs.updated?.[s.key] || 0;
    const pick = (mineEmpty, theirEmpty) => mineEmpty ? 'theirs' : theirEmpty ? 'mine' : (tt > tm ? 'theirs' : 'mine');
    if (s.items) {
      const a = cleanItems(s, dm), b = cleanItems(s, dt);
      if (!sameItem(a, b) || !!dm.none !== !!dt.none) {
        const both = s.log && a.length && b.length;
        diffs.push({ kind: 'list', s, tm, tt, mineV: listShow(s, dm), theirV: listShow(s, dt), choice: both ? 'both' : pick(!a.length && !dm.none, !b.length && !dt.none) });
      }
    }
    for (const f of s.fields || []) {
      if (f.female && !isFemale(mine) && !isFemale(theirs)) continue;
      const a = f.type === 'check' ? !!dm[f.k] : String(dm[f.k] ?? ''), b = f.type === 'check' ? !!dt[f.k] : String(dt[f.k] ?? '');
      if (a === b) continue;
      diffs.push({ kind: 'field', s, f, tm, tt, mineV: fieldShow(f, dm[f.k]), theirV: fieldShow(f, dt[f.k]), choice: pick(!filled(dm[f.k]), !filled(dt[f.k])) });
    }
  }
  return diffs;
}

function applyDiffs(mine, theirs, diffs) {
  const out = JSON.parse(JSON.stringify(mine));
  out.id = theirs.id;
  out.updated = out.updated || {};
  for (const d of diffs) {
    if (d.choice === 'mine') continue;
    const key = d.s.key, target = sec(out, key), src = sec(theirs, key);
    if (d.kind === 'list') {
      if (d.choice === 'theirs') { target.items = JSON.parse(JSON.stringify(cleanItems(d.s, src))); target.none = !!src.none; }
      else {
        const merged = cleanItems(d.s, target);
        for (const it of cleanItems(d.s, src)) if (!merged.some(x => sameItem(x, it))) merged.push(JSON.parse(JSON.stringify(it)));
        if (d.s.log) merged.sort((x, y) => (x.when || '').localeCompare(y.when || ''));
        target.items = merged; target.none = merged.length ? false : (target.none || src.none);
      }
    } else {
      target[d.f.k] = src[d.f.k];
    }
    out.updated[key] = Math.max(out.updated[key] || 0, theirs.updated?.[key] || 0, d.choice === 'both' ? Date.now() : 0);
  }
  out.savedAt = Date.now();
  return out;
}

async function renderMerge() {
  if (!incoming) { location.hash = '#/'; return; }
  const theirs = incoming.p;
  const people = await DB.all('people');
  let mine = people.find(x => x.id === theirs.id) || null;
  const nameOf = x => sec(x, 'basics').name || t('Unnamed');

  if (!mine && !incoming.target) {
    const sameName = people.find(x => nameOf(x).trim().toLowerCase() === nameOf(theirs).trim().toLowerCase());
    app().innerHTML = `
      <header class="bar"><a class="btn icon ghost" href="#/" aria-label="${t('Back')}" data-cancel>${ICON.back}</a><h1>${esc(t('Scanned {name}', { name: nameOf(theirs) }))}</h1></header>
      <main class="wrap">
        <section class="card settings-block"><h2>${esc(nameOf(theirs))}</h2>
          <p>${esc(madeLine(theirs, incoming.made))}</p>
          <p>${t('This phone has no page linked to this person yet. Add them as a new person, or pick the page that is the same person to compare and merge.')}</p>
          <label class="field"><span>${t('Same person as')}</span><select data-target><option value="">${t('Nobody here, add as new')}</option>
            ${people.map(x => `<option value="${x.id}" ${sameName && sameName.id === x.id ? 'selected' : ''}>${esc(nameOf(x))}</option>`).join('')}</select></label>
          <div class="row"><button class="btn" data-cancel>${t('Cancel')}</button><button class="btn primary" data-go>${t('Continue')}</button></div>
        </section>
      </main>`;
    $$('[data-cancel]').forEach(b => b.onclick = () => { incoming = null; location.hash = '#/'; });
    $('[data-go]').onclick = async () => {
      const target = $('[data-target]').value;
      if (!target) {
        theirs.created = theirs.created || Date.now();
        await DB.put('people', theirs);
        askPersist();
        incoming = null;
        toast(t('{name} added.', { name: nameOf(theirs) }));
        location.hash = `#/p/${theirs.id}`;
        return;
      }
      incoming.target = target;
      renderMerge();
    };
    return;
  }
  if (!mine) mine = people.find(x => x.id === incoming.target);
  const diffs = diffPeople(mine, theirs);
  const when = ts => ts ? t('changed {when}', { when: fmtStamp(ts) }) : t('never filled in');
  const empty = `<span class="muted">${t('Empty')}</span>`;
  const val = v => Array.isArray(v) ? (v.length ? v.map(x => `<div>${esc(x)}</div>`).join('') : empty) : (v ? esc(v) : empty);

  app().innerHTML = `
    <header class="bar"><a class="btn icon ghost" href="#/" aria-label="${t('Back')}" data-cancel>${ICON.back}</a><h1>${esc(t('Review {name}', { name: nameOf(mine) }))}</h1></header>
    <main class="wrap">
      <p class="muted" style="margin:0">${esc(t('QR made {made}.', { made: fmtStamp(incoming.made) }))} ${diffs.length
        ? count(diffs.length, '{n} difference found. Pick which one to keep for each. The newer one is already picked.', '{n} differences found. Pick which one to keep for each. The newer one is already picked.')
        : t('Everything already matches this phone.')}</p>
      ${diffs.map((d, i) => `<section class="card diff">
        <div class="sec-head"><h3>${esc(t(d.s.title))}${d.f ? ': ' + esc(t(d.f.label)) : ''}</h3></div>
        <label class="opt"><input type="radio" name="d${i}" value="mine" ${d.choice === 'mine' ? 'checked' : ''}>
          <span><b>${t('This phone')}</b> <span class="muted small">${when(d.tm)}</span><span class="v">${val(d.mineV)}</span></span></label>
        <label class="opt"><input type="radio" name="d${i}" value="theirs" ${d.choice === 'theirs' ? 'checked' : ''}>
          <span><b>${t('Scanned')}</b> <span class="muted small">${when(d.tt)}</span><span class="v">${val(d.theirV)}</span></span></label>
        ${d.kind === 'list' ? `<label class="opt"><input type="radio" name="d${i}" value="both" ${d.choice === 'both' ? 'checked' : ''}><span><b>${t('Keep both lists')}</b> <span class="muted small">${t('entries from each, without repeats')}</span></span></label>` : ''}
      </section>`).join('')}
      <div class="row" style="margin-top:16px"><button class="btn" data-cancel>${t('Cancel')}</button>
        ${diffs.length ? `<button class="btn primary" data-apply>${t('Apply')}</button>` : `<button class="btn primary" data-link>${t('Done')}</button>`}</div>
    </main>`;
  $$('[data-cancel]').forEach(b => b.onclick = () => { incoming = null; location.hash = '#/'; });
  const finish = async merged => {
    if (merged.id !== mine.id) await DB.del('people', mine.id);
    await DB.put('people', merged);
    incoming = null;
    location.hash = `#/p/${merged.id}`;
  };
  const link = $('[data-link]');
  if (link) link.onclick = () => finish(applyDiffs(mine, theirs, []));
  const apply = $('[data-apply]');
  if (apply) apply.onclick = async () => {
    diffs.forEach((d, i) => { d.choice = $(`input[name="d${i}"]:checked`).value; });
    const kept = diffs.filter(d => d.choice !== 'mine').length;
    await finish(applyDiffs(mine, theirs, diffs));
    toast(kept ? count(kept, '{n} change applied.', '{n} changes applied.') : t('Nothing changed on this phone.'));
  };
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// the saved language loads before the first screen draws
Promise.all([getSetting('lang'), getSetting('docLang')]).catch(() => []).then(([l, d] = []) => {
  uiLang = lang = LANGS[l] ? l : 'en';
  docLangSet = LANGS[d] ? d : '';
  document.documentElement.lang = uiLang;
  render();
});

</script>
