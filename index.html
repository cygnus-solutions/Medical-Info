<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medical Info Sheet</title>
<meta name="description" content="Keep each family member's medical history on your phone and show it to the doctor in an emergency. Free, offline, and nothing leaves your phone. Made by Cygnus Solutions.">
<meta name="author" content="Cygnus Solutions">
<meta name="theme-color" content="#101C2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medical Info">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="preload" href="vendor/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="i18n/th.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face {
  font-family: Cinzel;
  font-weight: 600;
  font-display: swap;
  src: url(vendor/fonts/cinzel-latin-600-normal.woff2) format("woff2");
}
/* Cygnus Solutions colours, from the shared tokens.css */
:root {
  --navy: #101C2B;
  --gold: #E0B45A;
  --gold-deep: #C89A3C;
  --chart2: #946A14;
  --brand-font: Cinzel, Georgia, serif;
  --bg: #F4F6F8;
  --card: #FFFFFF;
  --ink: #1B222C;
  --muted: #5F6B7B;
  --line: #E4E8ED;
  --field: #F7F8FA;
  --accent: #14497A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EFF7;
  --danger: #A31B1B;
  --danger-soft: #FBE9E9;
  --warn: #8A5A00;
  --warn-soft: #FBF0DA;
  --ok: #0E6B4F;
  --ok-soft: #E4F1EC;
  --shadow: 0 1px 2px rgba(16, 28, 43, .06), 0 2px 8px rgba(16, 28, 43, .06);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B131D;
    --card: #132030;
    --ink: #E9EDF2;
    --muted: #9FAABA;
    --line: #243447;
    --field: #0F1A27;
    --accent: #8DB8E6;
    --accent-ink: #081A2C;
    --accent-soft: #17304A;
    --danger: #FF8A80;
    --danger-soft: #3A1714;
    --warn: #F3B562;
    --warn-soft: #36270F;
    --ok: #7FD4A9;
    --ok-soft: #12301F;
    --shadow: none;
    --chart2: #E0B45A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B131D; --card: #132030; --ink: #E9EDF2; --muted: #9FAABA; --line: #243447; --field: #0F1A27;
  --accent: #8DB8E6; --accent-ink: #081A2C; --accent-soft: #17304A; --danger: #FF8A80; --danger-soft: #3A1714;
  --warn: #F3B562; --warn-soft: #36270F; --ok: #7FD4A9; --ok-soft: #12301F; --shadow: none; --chart2: #E0B45A; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Thai", "Leelawadee UI", Thonburi, sans-serif;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden, [hidden] { display: none !important; }

/* top bar, navy on every screen like the other Cygnus apps */
.bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--navy); color: #fff;
  border-bottom: 1px solid rgba(224, 180, 90, .25);
}
.bar h1 { font-size: 17px; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .35); }
.bar .btn.ghost { border-color: transparent; }
.bar .btn:hover { background: rgba(255, 255, 255, .08); }
.bar .btn.install, .bar .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--navy); }
.bar .saved, .bar .muted { color: rgba(255, 255, 255, .72); }
.bar :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.brand img { width: 26px; height: 32px; flex: none; }
.brand h1 { flex: 0 1 auto; font: 600 18px/1.1 var(--brand-font); letter-spacing: .04em; }
.brand h1 span { color: var(--gold); }
@media (max-width: 440px) {
  .bar .btn.scan { width: 40px; padding: 0; }
  .bar .btn.scan span { display: none; }
  .brand { gap: 8px; }
  .brand img { width: 22px; height: 27px; }
  .brand h1 { font-size: 16px; letter-spacing: .02em; }
}

/* language picker */
.langpick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.langpick .lang-label { display: inline-flex; align-items: center; gap: 6px; margin-right: 2px; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.langpick svg { width: 17px; height: 17px; flex: none; }
.langpick button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; }
.langpick button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wrap > .langpick.app { justify-content: center; margin: 28px 0 0; }
.settings-block .langpick { margin: 12px 0 0; }
.cardview .langpick { justify-content: center; margin: 0; }

/* credit line */
.credit { margin: 32px auto 8px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13.5px; text-align: left; }
.credit img { width: 22px; height: 27px; flex: none; }
.credit b { display: block; color: var(--ink); font: 600 13.5px/1.2 var(--brand-font); letter-spacing: .06em; }
.credit a { color: var(--muted); }
.about { display: flex; gap: 14px; align-items: center; }
.about img { width: 40px; height: 49px; flex: none; }
.about .who { font: 600 16px/1.2 var(--brand-font); letter-spacing: .05em; color: var(--ink); }
.wrap { max-width: 920px; margin: 0 auto; padding: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px;
  border-radius: 11px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
  font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn.icon { width: 44px; padding: 0; }
.btn svg { width: 20px; height: 20px; flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* home */
.people { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.person {
  display: flex; gap: 14px; align-items: center;
  padding: 14px; text-decoration: none; color: inherit;
}
.avatar {
  flex: none; width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 20px;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.person .name { font-weight: 650; font-size: 17px; }
.person .meta { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.red { background: var(--danger-soft); color: var(--danger); }
.chip.amber { background: var(--warn-soft); color: var(--warn); }
.chip.green { background: var(--ok-soft); color: var(--ok); }
.empty { text-align: center; padding: 48px 16px; }
.empty p { margin: 0 0 16px; }

/* doctor view */
.patient { padding: 18px; display: flex; gap: 16px; align-items: center; }
.patient .avatar { width: 76px; height: 76px; font-size: 26px; }
.patient h2 { font-size: clamp(21px, 6vw, 28px); font-weight: 750; letter-spacing: -.01em; }
.patient .goes { color: var(--muted); font-size: 15px; }
.patient .facts { margin-top: 6px; font-size: 16px; }
.blood { flex: none; text-align: center; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--danger); color: var(--danger); }
.blood b { display: block; font-size: 24px; line-height: 1; }
.blood span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

.alertbox { margin-top: 12px; padding: 16px 18px; border-radius: var(--radius); background: var(--danger-soft); border: 1.5px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.alertbox h3 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--danger); margin-bottom: 6px; }
.alertbox .allergy { font-size: 18px; font-weight: 700; color: var(--danger); }
.alertbox .allergy small { font-size: 15px; font-weight: 500; color: var(--ink); }
.alertbox ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.alertbox + .alertbox { margin-top: 8px; }
.alertbox.calm { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.alertbox.calm h3, .alertbox.calm .allergy { color: var(--ok); }
.alerts-list { display: flex; flex-wrap: wrap; gap: 8px; }
.alert-pill { background: var(--danger); color: #fff; font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 9px; }
:root[data-theme="dark"] .alert-pill { color: #2a0a07; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alert-pill { color: #2a0a07; } }
.kv-line { margin-top: 10px; font-size: 15px; }
.kv-line b { font-weight: 700; }

.sections { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .sections { grid-template-columns: 1fr 1fr; } .sections .wide { grid-column: 1 / -1; } }
.sec { padding: 14px 16px 16px; }
.sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.sec-head h3 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); flex: 1; }
.stamp { font-size: 12px; color: var(--muted); white-space: nowrap; }
.stamp.stale { color: var(--warn); font-weight: 700; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { padding: 8px 0; border-top: 1px solid var(--line); }
.items li:first-child { border-top: 0; padding-top: 0; }
.items .main { font-weight: 650; }
.items .sub { color: var(--muted); font-size: 14.5px; }
.items .sub b { color: var(--ink); font-weight: 600; }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: 14.5px; }
.kv dd { margin: 0; font-weight: 550; white-space: pre-wrap; }
.locked { display: flex; align-items: center; gap: 12px; }
.locked p { margin: 0; flex: 1; color: var(--muted); }
.docs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.doc { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--field); cursor: pointer; padding: 0; text-align: left; }
.doc .thumb { aspect-ratio: 4 / 3; background: var(--line) center / cover no-repeat; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.doc .cap { padding: 6px 8px; font-size: 13px; line-height: 1.3; }
.doc .cap b { display: block; font-size: 13.5px; }
.tel { font-weight: 700; text-decoration: none; }
.dose-now { color: var(--accent); font-weight: 650; }

.viewfoot { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

/* editor */
.edit-sec { margin-top: 12px; overflow: hidden; }
.edit-sec > summary {
  list-style: none; cursor: pointer; padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
}
.edit-sec > summary::-webkit-details-marker { display: none; }
.edit-sec > summary h3 { font-size: 17px; font-weight: 650; flex: 1; }
.edit-sec > summary .chev { transition: transform .15s; color: var(--muted); }
.edit-sec[open] > summary .chev { transform: rotate(90deg); }
.edit-body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
.intro { margin: 12px 0 0; color: var(--muted); font-size: 14.5px; }
.field { display: grid; gap: 4px; margin-top: 14px; }
.field > span:first-child { font-weight: 600; font-size: 14.5px; }
.field .hint { color: var(--muted); font-size: 13px; }
.field input:not([type="checkbox"]), .field select, .field textarea {
  width: 100%; min-height: 44px; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--field);
}
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-weight: 600; font-size: 15px; min-height: 32px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.grid2 { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.item-card { margin-top: 14px; padding: 2px 14px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
.item-card .item-top { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.item-card .item-top b { font-size: 14px; color: var(--muted); }
.add-item { margin-top: 14px; }
.sec-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
.photo-pick { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.doc-edit { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.doc-edit .thumb { width: 96px; aspect-ratio: 3 / 4; border-radius: 8px; background: var(--line) center / cover no-repeat; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.doc-edit .field:first-child { margin-top: 0; }
.saved { font-size: 13px; color: var(--muted); min-width: 56px; text-align: right; }

/* readings logs */
.log-form { margin-top: 14px; padding: 2px 14px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
.modal .log-form { padding: 0; border: 0; background: none; margin-top: 4px; }
.log-grid { display: grid; gap: 0 10px; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); align-items: end; }
.log-form .err { color: var(--danger); font-weight: 600; font-size: 14px; margin: 8px 0 0; }
.log-form .err:empty { display: none; }
.log-form .row { margin-top: 12px; }
.modal .log-form .row { justify-content: flex-end; }
.modal .card { max-height: calc(100vh - 32px); overflow-y: auto; }
.log-list { margin-top: 12px; max-height: 420px; overflow-y: auto; }
.log-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.log-row:first-child { border-top: 0; }
.log-row > div { flex: 1; min-width: 0; }
.log-row .v { display: block; font-weight: 700; font-size: 17px; }
.log-row .m { display: block; color: var(--muted); font-size: 13.5px; }
.lv-hi { color: var(--warn); }
.lv-hi2 { color: var(--danger); }
.log-sum { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.log-sum > div { padding: 10px 12px; border-radius: 10px; background: var(--field); border: 1px solid var(--line); }
.log-sum .lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.log-sum b { display: block; font-size: 24px; line-height: 1.2; margin: 2px 0; }
.log-sum span:last-child { font-size: 13.5px; color: var(--muted); }
.chart { display: block; width: 100%; max-width: 560px; height: auto; margin-top: 14px; }
.chart line.grid { stroke: var(--line); }
.chart line.ref { stroke: var(--warn); stroke-dasharray: 4 4; opacity: .6; }
.chart path { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
.chart .l1 { stroke: var(--accent); } .chart .d1 { fill: var(--accent); }
.chart .l2 { stroke: var(--chart2); } .chart .d2 { fill: var(--chart2); }
.chart text { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.legend .k1 { background: var(--accent); } .legend .k2 { background: var(--chart2); }
.flag { font-size: .62em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; vertical-align: .15em; margin-left: 2px; }
table.log { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14.5px; }
table.log th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px 0; }
table.log td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.log td.num { font-weight: 700; white-space: nowrap; }
table.log .flag { display: block; margin: 0; vertical-align: 0; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.log td:first-child { white-space: nowrap; }
.more-log summary { cursor: pointer; color: var(--accent); font-weight: 650; padding-top: 10px; }
.more-log table.log { margin-top: 4px; }
.due-over { color: var(--danger) !important; font-weight: 700; }
.due-soon { color: var(--warn) !important; font-weight: 700; }

/* card view */
.cardview { display: grid; gap: 16px; justify-items: center; }
.qr-big { background: #fff; padding: 14px; border-radius: 14px; width: min(100%, 360px); }
.qr-big svg { display: block; width: 100%; height: auto; }

/* wallet card, shared by screen preview and print */
.wcard {
  width: 85.6mm; height: 54mm; border-radius: 3.2mm; overflow: hidden;
  background: #fff; color: #111; border: .3mm solid #bbb;
  font: 7.2pt/1.25 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  display: flex; flex-direction: column;
}
.wcard .wtop { background: #101C2B; color: #fff; padding: 1.6mm 3mm; display: flex; align-items: center; gap: 2mm; font-weight: 800; letter-spacing: .08em; font-size: 7pt; }
.wcard .wtop .plus { width: 4mm; height: 4mm; border-radius: 1mm; background: #E0B45A; color: #101C2B; display: grid; place-items: center; font-size: 8pt; line-height: 1; }
.wcard .wtop .bt { margin-left: auto; background: #fff; color: #A31B1B; border-radius: 1mm; padding: .3mm 1.5mm; letter-spacing: 0; font-size: 8pt; }
.wcard .wbody { padding: 2mm 3mm; display: grid; gap: 1.4mm; flex: 1; overflow: hidden; align-content: start; }
.wcard .wname { font-size: 10pt; font-weight: 800; line-height: 1.1; }
.wcard .wl b { font-weight: 800; }
.wcard .wred { color: #A31B1B; }
.wcard .wby { font-size: 5.5pt; color: #6B7686; letter-spacing: .04em; }
.wcard .clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wcard .clip3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.wcard.back { flex-direction: row; align-items: center; padding: 3mm; gap: 3mm; }
.wcard.back .wqr { width: 46mm; height: 46mm; flex: none; }
.wcard.back .wqr svg { width: 100%; height: 100%; display: block; }
.wcard.back .wtext { font-size: 7.5pt; display: grid; gap: 1.5mm; }
.wcard.back .wtext b { font-size: 8.5pt; }
.cardpair { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.cardscale { transform-origin: top center; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 14, .55); display: grid; place-items: center; padding: 16px; }
.modal .card { width: min(100%, 400px); padding: 20px; }
.modal h2 { font-size: 19px; margin-bottom: 6px; }
.modal p { margin: 6px 0 0; color: var(--muted); }
.modal .err { color: var(--danger); font-weight: 600; min-height: 1.4em; margin-top: 8px; font-size: 14px; }
.modal .row { margin-top: 16px; justify-content: flex-end; }
.pin-input { letter-spacing: .5em; text-align: center; font-size: 24px !important; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.viewer { position: fixed; inset: 0; z-index: 55; background: #000; display: flex; flex-direction: column; }
.viewer .vbar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; color: #fff; }
.viewer .vbar b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer .vimg { flex: 1; overflow: auto; touch-action: pinch-zoom pan-x pan-y; display: grid; place-items: center; }
.viewer .vimg img { max-width: 100%; max-height: 100%; }
.viewer .vimg.full img { max-width: none; max-height: none; }
.viewer .btn { background: #222; color: #fff; border-color: #333; }

.settings-block { padding: 16px; margin-top: 12px; }
.settings-block h2 { font-size: 17px; margin-bottom: 4px; }
.settings-block p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
.settings-block .row { margin-top: 12px; }

#print { display: none; }

@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; color: #111; padding: 0; }
  #app, .toast, .modal, .viewer { display: none !important; }
  #print { display: block; }
  .pcards { display: flex; gap: 0; }
  .pcards .wcard { border: .3mm dashed #888; break-inside: avoid; }
  .pcards .wcard:first-child { border-right: .3mm dotted #bbb; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .pcards .wcard.back { border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .pcards .wtop { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pnote { font: 9pt system-ui, sans-serif; color: #555; margin-top: 6mm; }
  .psheet { font: 10pt/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111; }
  .psheet .sections { grid-template-columns: 1fr 1fr; gap: 4mm; }
  .psheet .sections .wide { grid-column: 1 / -1; }
  .psheet .card { box-shadow: none; border: .3mm solid #ccc; break-inside: avoid; }
  .psheet .alertbox, .psheet .alert-pill, .psheet .blood { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .psheet .patient h2 { font-size: 18pt; }
  .psheet .docs, .psheet .locked .btn, .psheet .more-log { display: none; }
  .psheet .chart { max-width: 120mm; }
}

/* share tabs, pager, scanner, merge */
.tabs { display: flex; gap: 4px; margin: 12px auto 0; padding: 4px; max-width: 520px; width: calc(100% - 32px); background: var(--line); border-radius: 12px; }
.tabs a { flex: 1; text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 650; font-size: 14px; color: var(--muted); text-decoration: none; }
.tabs a.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; }
.pager.single .btn { display: none; }
.center { text-align: center; max-width: 440px; margin: 0; }
.center-row { justify-content: center; }
.textview { width: 100%; max-width: 560px; }
.textview summary { padding: 12px 16px; cursor: pointer; font-weight: 650; }
.textview pre { margin: 0; padding: 0 16px 16px; white-space: pre-wrap; font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.scan { display: grid; gap: 14px; justify-items: center; }
.cam { position: relative; width: min(100%, 460px); aspect-ratio: 3 / 4; background: #000; border-radius: 16px; overflow: hidden; }
.cam video { width: 100%; height: 100%; object-fit: cover; }
.cam-frame { position: absolute; inset: 14%; border: 3px solid rgba(255,255,255,.85); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
.scan-status { margin: 0; text-align: center; font-weight: 600; max-width: 440px; }
.scan-bar { width: min(100%, 460px); height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.scan-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.diff { padding: 14px 16px; margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.opt .v { display: block; margin-top: 4px; white-space: pre-wrap; }
.pmade, .pby { display: none; }
@media print {
  .pmade { display: block; font-size: 9pt; color: #555; margin: 0 0 3mm; }
  .pby { display: block; font-size: 8.5pt; color: #6B7686; margin-top: 5mm; }
}

const MISSING = new Set();
function t(str, vars) {
  const dict = LANGS[lang]?.dict;
  let out = str;
  if (dict) { if (str in dict) out = dict[str]; else MISSING.add(str); }
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return out;
}
const count = (n, one, many) => t(n === 1 ? one : many, { n });
function inLang(l, fn) { const prev = lang; lang = l; try { return fn(); } finally { lang = prev; } }
async function inLangAsync(l, fn) { const prev = lang; lang = l; try { return await fn(); } finally { lang = prev; } }
const monthName = m => (LANGS[lang] || LANGS.en).months[m];

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso.length <= 10 ? iso + 'T00:00' : iso);
  if (isNaN(d)) return iso;
  return `${d.getDate()} ${monthName(d.getMonth())} ${yearOf(d.getFullYear())}`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function dayOf(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDose(iso, absolute) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (absolute) return `${d.getDate()} ${monthName(d.getMonth())} ${yearOf(d.getFullYear())} ${hm}`;
  if (diff === 0) return t('today {time}', { time: hm });
  if (diff === 1) return t('yesterday {time}', { time: hm });
  return `${d.getDate()} ${monthName(d.getMonth())}${d.getFullYear() !== now.getFullYear() ? ' ' + yearOf(d.getFullYear()) : ''} ${hm}`;
}
function localNow() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function age(dob) {
  if (!dob) return '';
  const d = new Date(dob + 'T00:00'), n = new Date();
  let m = (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth());
  if (n.getDate() < d.getDate()) m--;
  if (isNaN(m) || m < 0) return '';
  if (m < 24) return t('{n} mo', { n: m });
  return t('{n} y', { n: Math.floor(m / 12) });
}
function ago(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days < 1) return t('today');
  if (days < 2) return t('yesterday');
  if (days < 45) return t('{n} days ago', { n: days });
  const months = Math.round(days / 30.4);
  if (months < 18) return t('{n} months ago', { n: months });
  return t('{n} years ago', { n: Math.floor(days / 365) });
}
const isStale = ts => ts && (Date.now() - ts) > STALE_DAYS * 86400000;
function initials(name) {
  // Thai vowels written before the consonant are skipped so สมศรี ใจดี gives สจ
  const parts = String(name || '').trim().split(/\s+/).map(w => w.replace(/^[\u0E40-\u0E44]+/, '')).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function toast(msg, ms = 2600) {

  const el = document.createElement('div');

  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('medical-info-sheet', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore('people', { keyPath: 'id' });
        db.createObjectStore('files', { keyPath: 'id' });
        db.createObjectStore('settings', { keyPath: 'k' });
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async req(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const out = fn(tx.objectStore(store));

  get(store, key) { return this.req(store, 'readonly', s => s.get(key)); },
  all(store) { return this.req(store, 'readonly', s => s.getAll()); },
  put(store, val) { return this.req(store, 'readwrite', s => s.put(val)); },
  del(store, key) { return this.req(store, 'readwrite', s => s.delete(key)); },
};

/* ---------- PIN lock ---------- */
let unlockedUntil = 0;
async function hashPin(pin, salt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hasPin() { return !!(await getSetting('pin')); }
async function isUnlocked() {
  if (!(await hasPin())) return true;
  return Date.now() < unlockedUntil;
}
async function requireUnlock() {
  if (await isUnlocked()) { unlockedUntil = Date.now() + LOCK_AFTER_MS; return true; }
  const pin = await getSetting('pin');
  return new Promise(resolve => {
    const m = modal(`
      <h2>${t('Enter PIN')}</h2>
      <p>${t('Editing, IDs and documents are locked.')}</p>
      <div class="field"><input class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="${t('PIN')}"></div>
      <div class="err" role="alert"></div>
      <div class="row"><button class="btn" data-x>${t('Cancel')}</button><button class="btn primary" data-ok>${t('Unlock')}</button></div>`);
    const input = $('input', m), err = $('.err', m);
    const done = ok => { m.remove(); resolve(ok); };
    const tryIt = async () => {
      if ((await hashPin(input.value, pin.salt)) === pin.hash) {
        unlockedUntil = Date.now() + LOCK_AFTER_MS; done(true);
      } else { err.textContent = t('Wrong PIN.'); input.value = ''; input.focus(); }
    };
    $('[data-x]', m).onclick = () => done(false);
    $('[data-ok]', m).onclick = tryIt;
    input.onkeydown = e => { if (e.key === 'Enter') tryIt(); };
    setTimeout(() => input.focus(), 50);
  });
}
function lockNow() { unlockedUntil = 0; }
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); releaseWake(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 60000) {
    lockNow();
    if (/\/edit$|^#\/settings/.test(location.hash)) location.hash = '#/';
  }
  if (/^#\/p\/[^/]+$/.test(location.hash)) holdWake();
});

/* ---------- files ---------- */
const urlCache = new Map();
async function fileUrl(id) {
  if (!id) return '';
  if (urlCache.has(id)) return urlCache.get(id);
  const f = await DB.get('files', id);
  if (!f) return '';
  const u = URL.createObjectURL(f.blob);
  urlCache.set(id, u);
  return u;
}
function shrinkImage(file, maxSide, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => resolve(b || file), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(u); resolve(file); };
    img.src = u;
  });
}
async function storeFile(file, maxSide = 2000) {
  const isImg = /^image\//.test(file.type);
  const blob = isImg ? await shrinkImage(file, maxSide, 0.86) : file;
  const id = uid();
  await DB.put('files', { id, blob, type: blob.type || file.type, name: file.name || '' });
  return id;
}
function viewFile(id, title) {
  DB.get('files', id).then(f => {
    if (!f) return;
    const u = URL.createObjectURL(f.blob);
    if (!/^image\//.test(f.type)) { window.open(u, '_blank'); return; }
    const v = document.createElement('div');
    v.className = 'viewer';
    v.innerHTML = `<div class="vbar"><b>${esc(title)}</b><button class="btn sm" data-z>Full size</button><button class="btn sm" data-x>Close</button></div><div class="vimg"><img alt="${esc(title)}" src="${u}"></div>`;
    $('[data-x]', v).onclick = () => { v.remove(); URL.revokeObjectURL(u); };
    $('[data-z]', v).onclick = e => {
      const box = $('.vimg', v); box.classList.toggle('full');
      e.target.textContent = box.classList.contains('full') ? 'Fit screen' : 'Full size';
    };
    document.body.appendChild(v);
  });
}

async function render() {
  const h = location.hash.replace(/^#\/?/, '');

  $$('.modal').forEach(m => m.remove());
  if (current) await flushSave(current);

/* ---------- content checks ---------- */
function filled(v) { return v !== undefined && v !== null && v !== '' && v !== false; }
function itemFilled(item, fields) { return fields.some(f => filled(item[f.k])); }
function hasContent(p, key) {
  const s = SEC[key], d = sec(p, key);
  if (s.docs) return d.items.length > 0;
  if (d.none) return true;
  if (s.items && d.items.some(i => itemFilled(i, s.items))) return true;

/* ---------- readings logs and vaccines ---------- */
const DAY = 86400000;
const whenMs = r => new Date(r.when).getTime();
function readings(p, key) {
  const ok = key === 'bp' ? r => r.when && filled(r.sys) && filled(r.dia) : r => r.when && filled(r.value);
  return sec(p, key).items.filter(ok).sort((a, b) => a.when.localeCompare(b.when));

function bpLevel(r) {

  if (a >= 140 || b >= 90) return 'lv-hi';
  return '';
}
// limits in each unit: low, very high, fasting or before a meal, other times
const SUGAR_LIMITS = { 'mg/dL': [70, 300, 130, 180], 'mmol/L': [3.9, 16.7, 7.2, 10] };
function sugarLevel(r) {
  const [lo, top, fast, other] = SUGAR_LIMITS[r.unit] || SUGAR_LIMITS['mg/dL'], v = +r.value;
  if (v < lo || v >= top) return 'lv-hi2';
  if (v > (r.timing === 'Fasting' || r.timing === 'Before a meal' ? fast : other)) return 'lv-hi';
  return '';
}
function levelWord(key, r) {
  const lv = key === 'bp' ? bpLevel(r) : sugarLevel(r);
  if (!lv) return '';
  const low = key === 'bp' ? +r.sys < 90 : +r.value < (SUGAR_LIMITS[r.unit] || SUGAR_LIMITS['mg/dL'])[0];
  return t(low ? 'Low' : lv === 'lv-hi2' ? 'Very high' : 'High');
}
const flagHtml = (key, r) => { const w = levelWord(key, r); return w ? ` <span class="flag">${w}</span>` : ''; };
function bpText(r) { return `${r.sys}/${r.dia}`; }
function sugarText(r, unit) {
  const u = unit || r.unit || 'mg/dL';
  const v = u === (r.unit || 'mg/dL') ? +r.value : (u === 'mmol/L' ? mgdl(r) / 18 : mgdl(r));
  return `${u === 'mmol/L' ? v.toFixed(1) : Math.round(v)} ${u}`;
}
function readingLine(key, r, absolute) {
  const w = levelWord(key, r) ? `(${levelWord(key, r)})` : '';
  if (key === 'bp') return [fmtWhen(r.when, absolute) + ':', bpText(r), w, r.pulse ? t('pulse {n}', { n: r.pulse }) : '', r.note ? `(${r.note})` : ''].filter(Boolean).join(' ');
  return [fmtWhen(r.when, absolute) + ':', sugarText(r), w, r.timing ? t(r.timing) : '', r.note ? `(${r.note})` : ''].filter(Boolean).join(' ');
}
const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
function lastDays(list, days) { const from = Date.now() - days * DAY; return list.filter(r => whenMs(r) >= from); }
function bpAverage(list) {
  if (!list.length) return null;
  const pulses = list.filter(r => filled(r.pulse)).map(r => +r.pulse);
  return { text: `${Math.round(avg(list.map(r => +r.sys)))}/${Math.round(avg(list.map(r => +r.dia)))}`, pulse: pulses.length ? Math.round(avg(pulses)) : 0, n: list.length };
}
function sugarAverage(list, unit) {
  if (!list.length) return null;
  const v = avg(list.map(mgdl));
  return { text: unit === 'mmol/L' ? `${(v / 18).toFixed(1)} mmol/L` : `${Math.round(v)} mg/dL`, n: list.length };

const FASTING = r => r.timing === 'Fasting';
const AFTER_MEAL = r => r.timing === '2 hours after a meal';

// trend chart of the last 30 days, sized for a phone so the labels stay readable
function chartSvg(list, series, refs, step = 10) {
  const pts = lastDays(list, 30);
  if (pts.length < 2) return '';
  const W = 360, H = 170, L = 34, R = 10, T = 10, B = 24;
  const t0 = whenMs(pts[0]), t1 = Math.max(whenMs(pts[pts.length - 1]), t0 + DAY);
  const vals = pts.flatMap(r => series.map(sr => sr.get(r))).concat(refs);
  const lo = Math.floor((Math.min(...vals) - step) / step) * step, hi = Math.ceil((Math.max(...vals) + step) / step) * step;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  for (const v of refs) g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 4}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
  series.forEach((sr, i) => {
    const d = pts.map((r, j) => `${j ? 'L' : 'M'}${x(whenMs(r)).toFixed(1)} ${y(sr.get(r)).toFixed(1)}`).join('');
    g += `<path class="l${i + 1}" d="${d}"/>` + pts.map(r => `<circle class="d${i + 1}" cx="${x(whenMs(r)).toFixed(1)}" cy="${y(sr.get(r)).toFixed(1)}" r="3"/>`).join('');
  });
  const d0 = new Date(t0), d1 = new Date(whenMs(pts[pts.length - 1]));
  g += `<text x="${L}" y="${H - 6}">${d0.getDate()} ${monthName(d0.getMonth())}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${d1.getDate()} ${monthName(d1.getMonth())}</text>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map((sr, i) => `<span><i class="k${i + 1}"></i>${esc(t(sr.label))}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Readings over the last 30 days')}">${g}</svg>${legend}`;
}
function logTable(key, list, opts) {

    : `<tr><td>${esc(fmtWhen(r.when, opts.print))}</td><td class="num ${sugarLevel(r)}">${esc(sugarText(r))}${flagHtml('sugar', r)}</td><td>${esc(r.timing ? t(r.timing) : '')}</td><td>${esc(r.note || '')}</td></tr>`;
  const head = `<tr><th>${t('Time')}</th>${key === 'bp' ? `<th>${t('BP')}</th><th>${t('Pulse')}</th>` : `<th>${t('Sugar')}</th><th>${t('Taken')}</th>`}<th>${t('Note')}</th></tr>`;
  const shown = opts.print ? lastDays(desc, 90) : desc.slice(0, 10);
  const rest = opts.print ? [] : desc.slice(10);

    + (rest.length ? `<details class="more-log"><summary>${count(rest.length, '{n} older reading', '{n} older readings')}</summary><div class="table-scroll"><table class="log"><tbody>${rest.map(row).join('')}</tbody></table></div></details>` : '');
}
function bpBody(p, opts) {
  const list = readings(p, 'bp');
  if (!list.length) return '';
  const last = list[list.length - 1], wk = bpAverage(lastDays(list, 7));
  return `<div class="log-sum">
      <div><span class="lbl">${t('Latest')}</span><b class="${bpLevel(last)}">${esc(bpText(last))}${flagHtml('bp', last)}</b><span>${esc([last.pulse ? t('pulse {n}', { n: last.pulse }) : '', fmtWhen(last.when, opts.print)].filter(Boolean).join(', '))}</span></div>
      ${wk ? `<div><span class="lbl">${t('7-day average')}</span><b>${esc(wk.text)}</b><span>${wk.pulse ? esc(t('pulse {n}', { n: wk.pulse })) + ', ' : ''}${count(wk.n, '{n} reading', '{n} readings')}</span></div>` : ''}
    </div>

function sugarBody(p, opts) {

  if (!list.length) return '';
  const last = list[list.length - 1], unit = last.unit || 'mg/dL';

  const toUnit = v => unit === 'mmol/L' ? v / 18 : v;
  return `<div class="log-sum">
      <div><span class="lbl">${t('Latest')}</span><b class="${sugarLevel(last)}">${esc(sugarText(last))}${flagHtml('sugar', last)}</b><span>${esc([last.timing ? t(last.timing) : '', fmtWhen(last.when, opts.print)].filter(Boolean).join(', '))}</span></div>
      ${fa ? `<div><span class="lbl">${t('7-day fasting average')}</span><b>${esc(fa.text)}</b><span>${count(fa.n, '{n} reading', '{n} readings')}</span></div>` : ''}
      ${am ? `<div><span class="lbl">${t('7-day after-meal average')}</span><b>${esc(am.text)}</b><span>${count(am.n, '{n} reading', '{n} readings')}</span></div>` : ''}
    </div>

    ${logTable('sugar', list, opts)}

      ? t('High is above 7.2 fasting or before a meal, and above 10 at other times. Red is under 3.9, or 16.7 and higher.')
      : t('High is above 130 fasting or before a meal, and above 180 at other times. Red is under 70, or 300 and higher.')}</p>`;
}

// a vaccine picked from the list is shown in the reader's language, whichever language it was typed in
function vaccineKey(name) {
  const n = String(name || '').trim().toLowerCase();
  for (const k of [...VACCINE_NAMES, ...Object.values(OLD_VACCINES)]) {
    if (k.toLowerCase() === n) return k;
    for (const L of Object.values(LANGS)) if (L.dict?.[k] && L.dict[k].toLowerCase() === n) return k;
  }
  return '';
}
function vaccineGroups(p) {
  const items = sec(p, 'vaccines').items.filter(i => itemFilled(i, SEC.vaccines.items));
  const map = new Map();
  for (const it of items) {
    const known = vaccineKey(it.name);
    const name = known ? t(known) : (it.name || '').trim() || t('Vaccine not named');
    const k = known || name.toLowerCase();
    if (!map.has(k)) map.set(k, { name, shots: [] });
    map.get(k).shots.push(it);
  }
  const today = dayOf(Date.now()), soon = dayOf(Date.now() + 30 * DAY);
  return [...map.values()].map(g => {
    // a shot without a date was most likely just added, so it counts as the latest; text carried over from the old vaccine boxes stays first
    const order = sh => sh.date || (sh.dose || sh.lot || sh.next ? '9999' : '0000');
    g.shots.sort((a, b) => order(a).localeCompare(order(b)));
    g.next = g.shots[g.shots.length - 1].next || '';
    g.due = !g.next ? '' : g.next < today ? 'over' : g.next <= soon ? 'soon' : '';
    return g;
  });
}
function shotLine(sh) {
  const head = [sh.dose ? t(sh.dose) : '', sh.date ? fmtDate(sh.date) : (sh.dose ? t('date not written') : ''), sh.lot ? t('lot {lot}', { lot: sh.lot }) : '', sh.where].filter(Boolean).join(', ');
  return [head, sh.notes].filter(Boolean).join('. ');
}
function nextLine(g) {
  if (!g.next) return '';
  return t(g.due === 'over' ? 'Overdue. The next shot was due {date}' : 'Next shot due {date}', { date: fmtDate(g.next) });
}
function vaccinesBody(p) {
  return `<ul class="items">${vaccineGroups(p).map(g => `<li><div class="main">${esc(g.name)}</div>
    ${g.shots.map(sh => `<div class="sub">${esc(shotLine(sh))}</div>`).join('')}
    ${g.next ? `<div class="sub ${g.due ? 'due-' + g.due : ''}">${esc(nextLine(g))}</div>` : ''}</li>`).join('')}</ul>`;
}

/* ---------- adding readings ---------- */
function logInput(f, v) {
  let input;
  if (f.type === 'select') input = `<select data-log="${f.k}">${f.blank ? '<option value=""></option>' : ''}${optionsHtml(f.options, v)}</select>`;
  else if (f.type === 'number') input = `<input type="number" inputmode="decimal" step="any" data-log="${f.k}">`;
  else if (f.type === 'datetime') input = `<input type="datetime-local" data-log="${f.k}" value="${localNow()}">`;
  else input = `<input type="text" data-log="${f.k}" autocomplete="off">`;
  return `<label class="field"><span>${esc(t(f.label))}</span>${input}</label>`;
}
function logFormHtml(p, s, inModal) {
  const lastUnit = s.key === 'sugar' ? (readings(p, 'sugar').slice(-1)[0]?.unit || 'mg/dL') : '';
  const nums = s.items.filter(f => f.k !== 'when' && f.k !== 'note');
  const note = s.items.find(f => f.k === 'note');
  return `<div class="log-form" data-log-form="${s.key}">
    ${logInput(s.items[0])}
    <div class="log-grid">${nums.map(f => logInput(f, f.k === 'unit' ? lastUnit : '')).join('')}</div>
    <label class="field"><span>${esc(t(note.label))}</span><input type="text" data-log="note" autocomplete="off"><span class="hint">${esc(t(note.hint))}</span></label>
    <p class="err" role="alert"></p>
    <div class="row">${inModal ? `<button type="button" class="btn" data-x>${t('Cancel')}</button>` : ''}<button type="button" class="btn primary" data-log-add="${s.key}">${ICON.plus}${t('Add reading')}</button></div></div>`;
}
function logListHtml(p, s) {
  const list = [...readings(p, s.key)].reverse();
  if (!list.length) return `<p class="muted small" style="margin:12px 0 0">${t('No readings yet.')}</p>`;
  return `<div class="log-list">${list.map(r => `<div class="log-row"><div><span class="v ${s.key === 'bp' ? bpLevel(r) : sugarLevel(r)}">${esc(s.key === 'bp' ? bpText(r) : sugarText(r))}${flagHtml(s.key, r)}</span>
    <span class="m">${esc([s.key === 'bp' ? (r.pulse ? t('pulse {n}', { n: r.pulse }) : '') : (r.timing ? t(r.timing) : ''), fmtWhen(r.when), r.note].filter(Boolean).join(' · '))}</span></div>
    <button type="button" class="btn sm ghost danger" data-log-del="${esc(r.id)}">${t('Remove')}</button></div>`).join('')}</div>`;
}
// returns an error message, or '' once the reading is saved
function addReading(p, key, form) {
  const v = k => ($(`[data-log="${k}"]`, form)?.value || '').trim();
  const when = v('when');
  if (!when) return t('Choose the time of the reading.');
  let r;
  if (key === 'bp') {
    const sys = +v('sys'), dia = +v('dia'), pulse = v('pulse');
    if (!v('sys') || !v('dia')) return t('Write both the top and the bottom number.');
    if (sys <= dia) return t('The top number is always higher than the bottom one. Check {bp}.', { bp: `${sys}/${dia}` });
    if (sys < 50 || sys > 300 || dia < 20 || dia > 200) return t('Check {bp} on the machine.', { bp: `${sys}/${dia}` });
    r = { sys: String(sys), dia: String(dia), pulse };
  } else {
    const unit = v('unit') || 'mg/dL', val = +v('value');
    if (!v('value')) return t('Write the reading from the meter.');
    const okRange = unit === 'mmol/L' ? val >= 0.5 && val <= 55 : val >= 10 && val <= 1000;
    if (!okRange) return unit === 'mmol/L' && val > 55 ? t('{v} looks like mg/dL. Change the unit to mg/dL.', { v: val }) : t('Check {v}.', { v: `${val} ${unit}` });
    r = { value: String(val), unit, timing: v('timing') };
  }
  const d = sec(p, key);
  d.items.push({ id: uid(), when, ...r, note: v('note') });
  d.items.sort((a, b) => (a.when || '').localeCompare(b.when || ''));
  touch(p, key);
  return '';
}
function resetLogForm(form) {
  $$('[data-log]', form).forEach(el => {
    if (el.dataset.log === 'when') el.value = localNow();
    else if (el.tagName !== 'SELECT') el.value = '';
  });
  $('.err', form).textContent = '';
}
async function logFromView(p, key) {
  if (!(await requireUnlock())) return;
  const s = SEC[key];
  const m = modal(`<h2>${esc(t(s.title))}</h2><p>${esc(displayName(p))}</p>${logFormHtml(p, s, true)}`);
  const form = $('[data-log-form]', m);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-log-add]', m).onclick = async () => {
    const err = addReading(p, key, form);
    if (err) { $('.err', form).textContent = err; return; }
    p.savedAt = Date.now();
    await DB.put('people', p);
    m.remove();
    renderView(p);
  };
  setTimeout(() => $('[data-log="sys"], [data-log="value"]', m)?.focus(), 50);
}

/* ---------- doctor view ---------- */
function stamp(p, key) {
  const ts = p.updated?.[key];
  if (!ts) return '';
  const stale = isStale(ts);
  return `<span class="stamp${stale ? ' stale' : ''}">${esc(t('Updated {when}', { when: stale ? ago(ts) : fmtDate(dayOf(ts)) }))}</span>`;
}
function valueText(f, v) {
  if (f.type === 'check') return v ? t('Yes') : '';
  if (f.type === 'select') return t(String(v ?? ''));
  if (f.type === 'date') return fmtDate(v);
  if (f.type === 'datetime') return fmtDose(v);
  return String(v ?? '');
}
function kvList(p, s, d, skip = []) {
  const rows = (s.fields || []).filter(f => !skip.includes(f.k) && (!f.female || isFemale(p)) && filled(d[f.k]))
    .map(f => {
      let v = esc(valueText(f, d[f.k]));
      if (f.type === 'tel') v = `<a class="tel" href="tel:${esc(String(d[f.k]).replace(/[^\d+]/g, ''))}">${v}</a>`;
      return `<dt>${esc(t(f.label))}</dt><dd>${v}</dd>`;
    });
  return rows.length ? `<dl class="kv">${rows.join('')}</dl>` : '';
}
function secCard(p, s, body) {
  return `<section class="card sec${s.wide ? ' wide' : ''}"><div class="sec-head"><h3>${esc(t(s.title))}</h3>${stamp(p, s.key)}</div>${body}</section>`;
}
function telLink(n) { return n ? `<a class="tel" href="tel:${esc(String(n).replace(/[^\d+]/g, ''))}">${esc(n)}</a>` : ''; }

function sectionBody(p, key, opts = {}) {
  const s = SEC[key], d = sec(p, key);
  const list = (s.items ? d.items.filter(i => itemFilled(i, s.items)) : []);
  switch (key) {
    case 'meds': {
      let html = '';
      if (d.none && !list.length) html += `<p style="margin:0">${esc(t(s.none))}</p>`;
      if (list.length) html += `<ul class="items">${list.map(m => {
        const top = [m.name, m.dose, m.freq].filter(Boolean).map(esc).join(' &middot; ');
        const sub = [];
        if (m.reason) sub.push(esc(t('For {reason}', { reason: m.reason })));
        if (m.last) sub.push(`<span class="dose-now">${esc(t('Last dose {when}', { when: fmtDose(m.last, opts.print) }))}</span>`);
        return `<li><div class="main">${top}</div>${sub.length ? `<div class="sub">${sub.join(' &middot; ')}</div>` : ''}</li>`;
      }).join('')}</ul>`;
      const extra = kvList(p, s, d);
      if (extra) html += `<div style="margin-top:12px">${extra}</div>`;
      return html;
    }
    case 'conditions':
      return (d.none && !list.length) ? `<p style="margin:0">${esc(t(s.none))}</p>` : `<ul class="items">${list.map(c => `<li><div class="main">${esc(c.name)}${c.year ? ` <span class="muted" style="font-weight:500">${esc(t('since {year}', { year: c.year }))}</span>` : ''}</div>${c.by ? `<div class="sub">${esc(c.by)}</div>` : ''}</li>`).join('')}</ul>`;
    case 'surgeries':
      return (d.none && !list.length) ? `<p style="margin:0">${esc(t(s.none))}</p>` : `<ul class="items">${list.map(c => `<li><div class="main">${esc(c.what)}${c.year ? ` <span class="muted" style="font-weight:500">${esc(c.year)}</span>` : ''}</div>${c.where ? `<div class="sub">${esc(c.where)}</div>` : ''}</li>`).join('')}</ul>`;
    case 'contacts':
      return `<ul class="items">${list.map(c => `<li><div class="main">${esc(c.name)}${c.relation ? ` <span class="muted" style="font-weight:500">${esc(c.relation)}</span>` : ''}</div><div class="sub">${telLink(c.phone)}${c.consent ? ` &middot; <b>${t('Can sign consent')}</b>` : ''}</div></li>`).join('')}</ul>`;
    case 'doctors':
      return `<ul class="items">${list.map(c => `<li><div class="main">${esc(c.name)}${c.specialty ? ` <span class="muted" style="font-weight:500">${esc(c.specialty)}</span>` : ''}</div><div class="sub">${[telLink(c.phone), esc(c.clinic)].filter(Boolean).join(' &middot; ')}</div></li>`).join('')}</ul>`;
    case 'bp': return bpBody(p, opts);
    case 'sugar': return sugarBody(p, opts);
    case 'vaccines': return vaccinesBody(p);
    case 'aids': {
      const have = s.fields.filter(f => f.type === 'check' && d[f.k]).map(f => t(f.label));
      const rest = kvList(p, s, d, ['hearing', 'glasses', 'dentures']);
      return (have.length ? `<div class="chips" style="margin:0 0 10px">${have.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '') + rest;
    }
    case 'women': {
      const dd = { ...d };
      if (d.menopause) dd.lmp = '';
      return (d.menopause ? `<p style="margin:0 0 8px">${t('Post-menopausal')}</p>` : '') + kvList(p, s, dd, ['menopause']);
    }
    default:
      return kvList(p, s, d);
  }
}

async function docsBody(p) {
  const d = sec(p, 'docs');
  const tiles = await Promise.all(d.items.map(async (doc, i) => {
    const f = await DB.get('files', doc.file);
    const isImg = f && /^image\//.test(f.type);
    const u = isImg ? await fileUrl(doc.file) : '';
    return `<button class="doc" data-doc="${i}"><div class="thumb" style="${u ? `background-image:url('${u}')` : ''}">${u ? '' : 'PDF'}</div>
      <div class="cap"><b>${esc(t(doc.kind || 'Document'))}</b>${esc([doc.label, fmtDate(doc.date)].filter(Boolean).join(', '))}</div></button>`;
  }));
  return `<div class="docs">${tiles.join('')}</div>`;
}

async function viewHtml(p, opts = {}) {
  const b = sec(p, 'basics');
  const photo = opts.print ? '' : await fileUrl(b.photo);
  const facts = [age(b.dob), b.sex ? t(b.sex) : '', b.dob ? t('born {date}', { date: fmtDate(b.dob) }) : '', b.weight ? b.weight + ' kg' : '', b.height ? b.height + ' cm' : ''].filter(Boolean).map(esc).join(' &middot; ');
  const al = sec(p, 'allergies');
  const allergies = al.items.filter(i => i.what);
  const alerts = sec(p, 'alerts');
  const pills = [];
  if (alerts.bloodThinner) pills.push(t('Blood thinner'));
  if (alerts.insulin) pills.push(t('Insulin'));
  if (alerts.steroids) pills.push(t('Long-term steroids'));
  if (alerts.pregnant && isFemale(p)) pills.push(t('Pregnant'));
  if (alerts.noBlood) pills.push(t('Refuses blood transfusion'));
  if (alerts.implant) pills.push(alerts.implant);
  if (alerts.codeStatus && alerts.codeStatus.startsWith('Do not')) pills.unshift('DNR');

  let allergyBox;
  if (allergies.length) {
    allergyBox = `<div class="alertbox"><h3>${t('Allergies')}</h3><ul>${allergies.map(a =>
      `<li class="allergy">${esc(a.what)}${a.severity ? ` <small>${esc(t(a.severity))}</small>` : ''}${a.reaction ? `<br><small>${esc(a.reaction)}</small>` : ''}</li>`).join('')}</ul>
      ${stamp(p, 'allergies') ? `<div style="margin-top:8px">${stamp(p, 'allergies')}</div>` : ''}</div>`;
  } else if (al.none) {
    allergyBox = `<div class="alertbox calm"><h3>${t('Allergies')}</h3><div class="allergy">${t('No known allergies')}</div></div>`;
  } else {
    allergyBox = `<div class="alertbox" style="background:var(--warn-soft);border-color:transparent"><h3 style="color:var(--warn)">${t('Allergies')}</h3><div>${t('Not filled in')}</div></div>`;
  }
  const alertLines = [];
  if (alerts.codeStatus) alertLines.push(`<div class="kv-line"><b>${t('Code status:')}</b> ${esc(t(alerts.codeStatus))}</div>`);
  if (alerts.decider) alertLines.push(`<div class="kv-line"><b>${t('Decides if the patient cannot:')}</b> ${esc(alerts.decider)}</div>`);
  if (alerts.directive) alertLines.push(`<div class="kv-line"><b>${t('Advance directive:')}</b> ${esc(alerts.directive)}</div>`);
  if (alerts.other) alertLines.push(`<div class="kv-line" style="white-space:pre-wrap"><b>${t('Other alert:')}</b> ${esc(alerts.other)}</div>`);
  const alertBox = (pills.length || alertLines.length) ? `<div class="alertbox"><h3>${t('Alerts')}</h3>
    ${pills.length ? `<div class="alerts-list">${pills.map(x => `<span class="alert-pill">${esc(x)}</span>`).join('')}</div>` : ''}${alertLines.join('')}</div>` : '';

  const unlocked = await isUnlocked();
  const order = ['meds', 'conditions', 'surgeries', 'baseline', 'bp', 'sugar', 'women', 'contacts', 'vaccines', 'history', 'aids', 'doctors', 'care', 'ids', 'docs'];
  const cards = [];
  for (const key of order) {
    const s = SEC[key];
    if (s.female && !isFemale(p)) continue;
    if (!hasContent(p, key)) continue;
    if (s.locked && !unlocked) {
      if (opts.print) continue;
      cards.push(`<section class="card sec${s.wide ? ' wide' : ''}"><div class="sec-head"><h3>${esc(t(s.title))}</h3></div>
        <div class="locked"><p>${t('Locked')}</p><button class="btn sm" data-unlock>${ICON.lock}${t('Enter PIN to show')}</button></div></section>`);
      continue;
    }
    if (key === 'docs') { if (!opts.print) cards.push(secCard(p, s, await docsBody(p))); continue; }
    cards.push(secCard(p, s, sectionBody(p, key, opts)));
  }
  const lastSaved = p.savedAt ? fmtDate(dayOf(p.savedAt)) : '';
  return `
    <section class="card patient">
      <div class="avatar">${photo ? `<img alt="" src="${photo}">` : esc(initials(b.name))}</div>
      <div style="flex:1;min-width:0">
        <h2>${esc(b.name || t('Unnamed'))}</h2>
        ${b.goesBy ? `<div class="goes">${esc(t('Goes by {name}', { name: b.goesBy }))}</div>` : ''}
        ${facts ? `<div class="facts">${facts}</div>` : ''}
        ${b.language ? `<div class="muted small" style="margin-top:2px">${esc(t('Speaks {languages}', { languages: b.language }))}</div>` : ''}
      </div>
      ${b.blood ? `<div class="blood"><span>${t('Blood')}</span><b>${esc(b.blood === 'Unknown' ? '?' : b.blood)}</b></div>` : ''}
    </section>
    ${allergyBox}${alertBox}
    <div class="sections">${cards.join('')}</div>
    ${lastSaved ? `<p class="muted small" style="margin-top:14px">${esc(t('Last changed {date}. Filled in by the family.', { date: lastSaved }))}</p>` : ''}`;
}

async function renderView(p) {
  const body = await inLangAsync(docLang(), () => viewHtml(p));
  app().innerHTML = `
    <header class="bar"><a class="btn icon ghost" href="#/" aria-label="${t('Back')}">${ICON.back}</a><h1>${t('Summary')}</h1>
      <a class="btn sm" href="#/p/${p.id}/share">${ICON.card}${t('Share')}</a>
      <a class="btn sm" href="#/p/${p.id}/edit">${ICON.edit}${t('Edit')}</a></header>
    <main class="wrap">${langPicker('doc')}<div lang="${docLang()}">${body}</div>
      <div class="viewfoot"><button class="btn" data-log-view="bp">${ICON.plus}${t('Log blood pressure')}</button><button class="btn" data-log-view="sugar">${ICON.plus}${t('Log blood sugar')}</button></div>
    </main>`;
  bindLangPicker(() => renderView(p));

/* ---------- editor ---------- */
let saveTimer = null;
let savePromise = Promise.resolve();
function markSaving() { const el = $('.saved'); if (el) el.textContent = t('Saving'); }
function scheduleSave(p) {
  markSaving();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    p.savedAt = Date.now();
    savePromise = DB.put('people', p).then(() => {
      askPersist();
      const el = $('.saved'); if (el) el.textContent = t('Saved');
    });
  }, 350);
}
async function flushSave(p) {
  if (saveTimer) {
    clearTimeout(saveTimer); saveTimer = null;
    p.savedAt = Date.now();
    savePromise = DB.put('people', p);
  }
  await savePromise;
}
function touch(p, key) {
  p.updated = p.updated || {};
  p.updated[key] = Date.now();
}

let fieldSeq = 0;
function fieldHtml(f, v, name) {
  const id = 'f' + (++fieldSeq);
  if (f.type === 'check') {
    return `<label class="check"><input type="checkbox" data-f="${esc(name)}" ${v ? 'checked' : ''}>${esc(t(f.label))}</label>`;
  }
  let input;
  if (f.type === 'select') {
    input = `<select id="${id}" data-f="${esc(name)}"><option value=""></option>${optionsHtml(f.options, v)}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" data-f="${esc(name)}" rows="3">${esc(v)}</textarea>`;
  } else if (f.type === 'datetime') {
    input = `<div class="inline"><input id="${id}" type="datetime-local" data-f="${esc(name)}" value="${esc(v)}"><button type="button" class="btn sm" data-now="${esc(name)}">${t('Taken now')}</button></div>`;
  } else {
    const typ = { date: 'date', number: 'number', tel: 'tel' }[f.type] || 'text';
    const extra = f.type === 'number' ? ' inputmode="decimal" step="any"' : '';
    input = `<input id="${id}" type="${typ}" data-f="${esc(name)}" value="${esc(v)}"${extra}${f.list ? ` list="${f.list}"` : ''} autocomplete="off">`;
  }
  return `<label class="field" for="${id}"><span>${esc(t(f.label))}</span>${input}${f.hint ? `<span class="hint">${esc(t(f.hint))}</span>` : ''}</label>`;
}
// stored values stay in English so a page reads the same on every phone; only the shown text changes
function optionsHtml(options, v) {
  return options.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(t(o))}</option>`).join('');
}

function editSectionHtml(p, s) {
  const d = sec(p, s.key);
  let body = s.intro ? `<p class="intro">${esc(t(s.intro))}</p>` : '';
  if (s.key === 'basics') {

      ${d.photo ? `<button type="button" class="btn sm ghost" data-photo-remove>${t('Remove photo')}</button>` : ''}</div>
      <p class="hint muted small" style="margin:6px 0 0">${t('A face photo helps staff match the page to the patient.')}</p>`;
  }
  if (s.log) {

    return `<details class="card edit-sec" data-sec="${s.key}">
      <summary><h3>${esc(t(s.title))}</h3>${n ? `<span class="chip">${count(n, '{n} reading', '{n} readings')}</span>` : ''}${ICON.chev}</summary>

  }
  if (s.fields) {
    const fields = s.fields.filter(f => !f.female || isFemale(p));
    body += `<div class="grid2">${fields.map(f => fieldHtml(f, d[f.k], f.k)).join('')}</div>`;
  }
  if (s.docs) {
    body += `<div data-docs></div>
      <label class="btn sm add-item">${ICON.plus}${t('Add photo or PDF')}<input type="file" accept="image/*,application/pdf" multiple data-add-doc hidden></label>`;
  }
  const ts = p.updated?.[s.key];
  body += `<div class="sec-actions">${ts ? `<span class="stamp${isStale(ts) ? ' stale' : ''}">${esc(t('Updated {when}', { when: ago(ts) }))}</span>` : `<span class="stamp">${t('Not filled in')}</span>`}
    <span class="spacer"></span>${ts ? `<button type="button" class="btn sm" data-confirm>${t('Still correct')}</button>` : ''}</div>`;
  const stale = ts && isStale(ts);
  return `<details class="card edit-sec" data-sec="${s.key}" ${s.key === 'basics' ? 'open' : ''}>
    <summary><h3>${esc(t(s.title))}${s.locked ? ' <span class="muted" style="font-weight:500;font-size:13px">PIN</span>' : ''}</h3>

    <div class="edit-body">${body}</div></details>`;
}
function itemHtml(s, it, i) {

function onEditInput(p, e) {
  const el = e.target;
  const secEl = el.closest('[data-sec]');
  if (!secEl) return;
  const key = secEl.dataset.sec, s = SEC[key], d = sec(p, key);

  if (el.type === 'file') { if (e.type === 'change') return el.matches('[data-photo]') ? pickPhoto(p, el) : addDocs(p, el); return; }
  if (e.type !== 'input') return;
  if (el.matches('[data-none]')) { d.none = el.checked; touch(p, key); scheduleSave(p); return; }
  if (!el.dataset.f) return;

  const val = el.type === 'checkbox' ? el.checked : el.value;
  const name = el.dataset.f;
  let m;
  if ((m = name.match(/^d(\d+)\.(\w+)$/))) {
    d.items[+m[1]][m[2]] = val;
  } else if ((m = name.match(/^(\d+)\.(\w+)$/))) {
    d.items[+m[1]][m[2]] = val;
  } else {
    d[name] = val;
  }
  touch(p, key);
  scheduleSave(p);
  if (key === 'basics' && name === 'name') $('.bar h1').textContent = val || t('Unnamed');
  if (key === 'basics' && name === 'sex') { flushSave(p).then(() => renderEdit(p)); }
}

async function onEditClick(p, e) {
  const btn = e.target.closest('button, [data-now]');
  if (!btn) return;
  const secEl = btn.closest('[data-sec]');
  const key = secEl?.dataset.sec, s = SEC[key], d = key ? sec(p, key) : null;

  if (btn.matches('[data-delete]')) {
    const ok = await confirmBox(t('Delete {name}?', { name: displayName(p) }), t('This removes the profile and its documents from this phone.'), t('Delete'), true);
    if (!ok) return;
    for (const doc of sec(p, 'docs').items) await DB.del('files', doc.file);
    if (sec(p, 'basics').photo) await DB.del('files', sec(p, 'basics').photo);
    await DB.del('people', p.id);
    clearTimeout(saveTimer); saveTimer = null;
    location.hash = '#/';
    return;
  }
  if (!s) return;
  if (btn.dataset.logAdd) {
    const form = btn.closest('[data-log-form]');
    const err = addReading(p, key, form);
    $('.err', form).textContent = err;
    if (err) return;
    scheduleSave(p);
    resetLogForm(form);
    $('[data-log-list]', secEl).innerHTML = logListHtml(p, s);
    const n = readings(p, key).length, sum = $('summary', secEl);
    $('.chip', sum)?.remove();
    sum.querySelector('h3').insertAdjacentHTML('afterend', `<span class="chip">${count(n, '{n} reading', '{n} readings')}</span>`);
    return;
  }
  if (btn.dataset.logDel) {
    if (!(await confirmBox(t('Remove this reading?'), '', t('Remove'), true))) return;
    d.items = d.items.filter(r => r.id !== btn.dataset.logDel);
    touch(p, key); scheduleSave(p);
    $('[data-log-list]', secEl).innerHTML = logListHtml(p, s);
    return;
  }
  if (btn.dataset.booster !== undefined) {
    const from = d.items[+btn.dataset.booster] || {};
    const NEXT_DOSE = { '1st dose': '2nd dose', '2nd dose': '3rd dose', '3rd dose': '4th dose', 'Yearly shot': 'Yearly shot' };
    d.items.push({ name: from.name || '', dose: NEXT_DOSE[from.dose] || 'Booster' });
    const i = d.items.length - 1;
    $('[data-items]', secEl).insertAdjacentHTML('beforeend', itemHtml(s, d.items[i], i));
    touch(p, key); scheduleSave(p);
    const card = $(`[data-item="${i}"]`, secEl);
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    $(`[data-f="${i}.date"]`, card)?.focus({ preventScroll: true });
    return;
  }
  if (btn.dataset.now !== undefined) {
    const [i, k] = btn.dataset.now.split('.');
    d.items[+i][k] = localNow();
    $(`[data-f="${btn.dataset.now}"]`, secEl).value = d.items[+i][k];
    touch(p, key); scheduleSave(p);
    toast(t('Last dose set to now.'));
    return;
  }
  if (btn.matches('[data-add-item]')) {
    d.items.push({});
    $('[data-items]', secEl).insertAdjacentHTML('beforeend', itemHtml(s, {}, d.items.length - 1));
    $('[data-items] .item-card:last-child input, [data-items] .item-card:last-child select', secEl)?.focus();
    return;
  }
  if (btn.dataset.removeItem !== undefined) {
    const i = +btn.dataset.removeItem;
    const it = d.items[i];
    if (itemFilled(it, s.items) && !(await confirmBox(t('Remove this {item}?', { item: t(s.itemName) }), '', t('Remove'), true))) return;
    d.items.splice(i, 1);
    $('[data-items]', secEl).innerHTML = d.items.map((x, j) => itemHtml(s, x, j)).join('');
    touch(p, key); scheduleSave(p);
    return;
  }
  if (btn.matches('[data-confirm]')) {
    touch(p, key); scheduleSave(p);
    const st = $('.sec-actions .stamp', secEl);
    st.textContent = t('Updated {when}', { when: t('today') }); st.classList.remove('stale');
    const chip = $('summary .chip', secEl); if (chip) { chip.className = 'chip green'; chip.textContent = t('Filled'); }
    return;
  }
  if (btn.matches('[data-photo-remove]')) {
    await DB.del('files', d.photo); d.photo = '';
    touch(p, key); await flushSave(p); scheduleSave(p);
    renderEdit(p);
    return;
  }
  if (btn.dataset.removeDoc !== undefined) {
    if (!(await confirmBox(t('Remove this document?'), '', t('Remove'), true))) return;
    const i = +btn.dataset.removeDoc;
    await DB.del('files', d.items[i].file);
    d.items.splice(i, 1);
    touch(p, key); scheduleSave(p);
    renderDocsEditor(p, secEl);
    return;
  }
  if (btn.dataset.openDoc !== undefined) {
    const doc = d.items[+btn.dataset.openDoc];
    viewFile(doc.file, [doc.kind, doc.label].filter(Boolean).join(': '));
  }
}

async function pickPhoto(p, input) {
  const file = input.files?.[0];
  if (!file) return;
  const b = sec(p, 'basics');
  if (b.photo) await DB.del('files', b.photo);
  b.photo = await storeFile(file, 600);
  touch(p, 'basics');
  scheduleSave(p);
  await flushSave(p);
  renderEdit(p);
}
async function addDocs(p, input) {
  const files = [...(input.files || [])];
  if (!files.length) return;
  const d = sec(p, 'docs');
  for (const f of files) {
    const id = await storeFile(f, 2200);
    const guess = /ecg|ekg/i.test(f.name) ? 'ECG' : '';
    d.items.push({ file: id, kind: guess, label: '', date: '' });
  }
  touch(p, 'docs');
  scheduleSave(p);
  await flushSave(p);
  renderDocsEditor(p, $('[data-sec="docs"]'));
  toast(count(files.length, '{n} document added.', '{n} documents added.'));
}

/* ---------- summary text for QR ---------- */
function summaryText(p, budget) {
  const b = sec(p, 'basics'), al = sec(p, 'allergies'), a = sec(p, 'alerts'), m = sec(p, 'meds');
  const groups = [];
  groups.push(t('MEDICAL INFO: {name}', { name: (b.name || t('Unnamed')) + (b.goesBy ? ' (' + b.goesBy + ')' : '') }));
  groups.push([b.dob ? t('Born {date} ({age})', { date: fmtDate(b.dob), age: age(b.dob) }) : '', b.sex ? t(b.sex) : '', b.blood ? t('Blood {type}', { type: t(b.blood) }) : '', b.weight ? b.weight + ' kg' : ''].filter(Boolean).join(', '));
  const alls = al.items.filter(i => i.what).map(i => i.what + ((i.severity || i.reaction) ? ` (${[i.severity ? t(i.severity) : '', i.reaction].filter(Boolean).join(': ')})` : ''));
  groups.push(t('ALLERGIES: {list}', { list: alls.length ? alls.join('; ') : t(al.none ? 'none known' : 'not filled in') }));
  const flags = [];
  if (a.codeStatus && a.codeStatus.startsWith('Do not')) flags.push('DNR');
  if (a.bloodThinner) flags.push(t('blood thinner'));
  if (a.insulin) flags.push(t('insulin'));
  if (a.steroids) flags.push(t('long-term steroids'));
  if (a.pregnant && isFemale(p)) flags.push(t('pregnant'));
  if (a.noBlood) flags.push(t('refuses blood transfusion'));
  if (a.implant) flags.push(a.implant);
  if (flags.length) groups.push(t('ALERTS: {list}', { list: flags.join('; ') }));
  const meds = m.items.filter(i => i.name).map(i => [i.name, i.dose, i.freq].filter(Boolean).join(' ') + (i.last ? ', ' + t('last dose {when}', { when: fmtDose(i.last, true) }) : ''));
  if (meds.length) groups.push(t('MEDS: {list}', { list: meds.join('; ') }));
  else if (m.none) groups.push(t('MEDS: {list}', { list: t('none') }));
  const cond = sec(p, 'conditions').items.filter(i => i.name).map(i => i.name + (i.year ? ` (${i.year})` : ''));
  if (cond.length) groups.push(t('CONDITIONS: {list}', { list: cond.join('; ') }));
  const contacts = sec(p, 'contacts').items.filter(i => i.name || i.phone);
  const contactLine = c => t('CONTACT: {who}', { who: [c.name, c.relation ? `(${c.relation}${c.consent ? ', ' + t('can consent') : ''})` : '', c.phone].filter(Boolean).join(' ') });
  if (contacts[0]) groups.push(contactLine(contacts[0]));
  const surg = sec(p, 'surgeries').items.filter(i => i.what).map(i => i.what + (i.year ? ` ${i.year}` : ''));
  if (surg.length) groups.push(t('SURGERY/ADMISSIONS: {list}', { list: surg.join('; ') }));
  const bl = sec(p, 'baseline');
  const usual = [bl.bp ? t('BP {v}', { v: bl.bp }) : '', bl.sugar ? t('sugar {v}', { v: bl.sugar }) : '', bl.creatinine ? t('creatinine {v}', { v: bl.creatinine }) : '', bl.mental, bl.mobility].filter(Boolean);
  if (usual.length) groups.push(t('USUAL: {list}', { list: usual.join('; ') }));
  const bpw = bpAverage(lastDays(readings(p, 'bp'), 7));
  if (bpw) groups.push(t('BP 7-DAY AVERAGE: {bp} ({n})', { bp: bpw.text, n: bpw.n }));
  if (a.codeStatus && !a.codeStatus.startsWith('Do not')) groups.push(t('CODE STATUS: {v}', { v: t(a.codeStatus) }));
  if (a.decider) groups.push(t('DECIDES: {v}', { v: a.decider }));
  for (const c of contacts.slice(1)) groups.push(contactLine(c));
  const doc = sec(p, 'doctors').items.find(i => i.name);
  if (doc) groups.push(t('DOCTOR: {v}', { v: [doc.name, doc.specialty, doc.phone].filter(Boolean).join(', ') }));
  if (sec(p, 'care').hospital) groups.push(t('HOSPITAL: {v}', { v: sec(p, 'care').hospital }));

  const head = madeLine(p);
  const more = t('More on the family\'s phone.');
  const enc = s => new TextEncoder().encode(s).length;
  const out = [head];
  let used = enc(head) + 1;
  let cut = false;
  for (const g of groups.filter(Boolean)) {
    const n = enc(g) + 1;
    if (used + n + enc(more) + 1 > budget) {
      // keep a trimmed version of the line when there is room for the start of it
      const room = budget - used - enc(more) - 2;
      if (room > 40) {
        let part = g;
        while (enc(part + '...') > room) part = part.slice(0, -1);
        out.push(part + '...');
      }
      cut = true;
      break;
    }
    out.push(g); used += n;
  }
  if (cut) out.push(more);
  return out.join('\n');
}
function fmtStamp(ts) {
  const d = new Date(ts);
  return `${d.getDate()} ${monthName(d.getMonth())} ${yearOf(d.getFullYear())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function madeLine(p, made = Date.now(), printed) {
  return t(printed ? 'Printed {made}. Info last changed {changed}.' : 'QR made {made}. Info last changed {changed}.', { made: fmtStamp(made), changed: fmtDate(dayOf(p.savedAt || made)) });
}
function qrSvg(text) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const q = qrcode(0, 'L');
  q.addData(text, 'Byte');
  q.make();
  const n = q.getModuleCount(), m = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="${t('QR code')}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

function fitCards() {
  const avail = Math.min(document.documentElement.clientWidth - 32, 440);
  $$('.cardscale').forEach(el => {
    const c = el.firstElementChild;
    const s = Math.min(1.3, avail / c.offsetWidth);
    c.style.transformOrigin = 'top left';
    c.style.transform = `scale(${s})`;
    el.style.width = (c.offsetWidth * s) + 'px';
    el.style.height = (c.offsetHeight * s) + 'px';
  });
}
function printNow(html) {
  const box = $('#print');
  box.innerHTML = html;
  const prev = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = 'light';
  const restore = () => {
    if (prev) document.documentElement.dataset.theme = prev; else delete document.documentElement.dataset.theme;
    box.innerHTML = '';
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  setTimeout(() => window.print(), 50);
}

function blobToDataUrl(blob) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
}
async function dataUrlToBlob(u) { return (await fetch(u)).blob(); }

async function exportPeople(list) {
  const files = {};
  for (const p of list) {
    const ids = [sec(p, 'basics').photo, ...sec(p, 'docs').items.map(d => d.file)].filter(Boolean);
    for (const id of ids) {
      const f = await DB.get('files', id);
      if (f) files[id] = { type: f.type, name: f.name, data: await blobToDataUrl(f.blob) };
    }
  }
  const payload = { app: 'medical-info-sheet', version: 1, exported: new Date().toISOString(), people: list, files };
  const today = dayOf(Date.now());
  const label = list.length === 1 ? displayName(list[0]).replace(/[^\w\- ]+/g, '').trim() : 'Family';
  const name = `Medical Info - ${label} - ${today}.json`;
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(t('Saved {file}', { file: name }));
}

async function importFile(file) {
  if (!file) return;
  if (!(await requireUnlock())) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast(t('{file} could not be read.', { file: file.name })); return; }
  if (data?.app !== 'medical-info-sheet' || !Array.isArray(data.people)) { toast(t('{file} is not a Medical Info Sheet export.', { file: file.name })); return; }
  let added = 0, updated = 0, kept = 0;
  for (const p of data.people) {
    if (!p || !goodId(p.id) || !p.data) continue;
    const mine = await DB.get('people', p.id);
    if (mine && (mine.savedAt || 0) >= (p.savedAt || 0)) { kept++; continue; }
    const ids = [p.data.basics?.photo, ...(p.data.docs?.items || []).map(d => d.file)].filter(Boolean);
    for (const id of ids) {
      const f = data.files?.[id];
      if (f) await DB.put('files', { id, type: f.type, name: f.name, blob: await dataUrlToBlob(f.data) });
    }
    await DB.put('people', p);
    mine ? updated++ : added++;
  }
  askPersist();
  const parts = [];
  if (added) parts.push(t('{n} added', { n: added }));
  if (updated) parts.push(t('{n} updated', { n: updated }));
  if (kept) parts.push(t('{n} kept since this phone had the newer copy', { n: kept }));
  toast(parts.length ? parts.join(', ') + '.' : t('No people in this file.'), 4000);
  renderSettings();
}
